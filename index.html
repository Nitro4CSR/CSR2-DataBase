<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSR2 DataBase</title>
<style>
:root{
  --bg:#0e1014; --bg2:#151820; --card:#1b1f29; --card2:#222735; --line:#2c3243;
  --text:#e8eaf0; --muted:#9aa3b5; --accent:#ff7a1a; --accent2:#ffb46b;
  --gold:#f2c230; --purple:#b07cff; --legend:#3fd0c9; --tnr:#ff5470; --shop:#8fa0b8;
  --ok:#3ecf8e; --warn:#ffcc4d; --radius:12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent2)}
header{position:sticky;top:0;z-index:20;display:flex;gap:16px;align-items:center;padding:10px 20px;
  background:rgba(14,16,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.5px;cursor:pointer;white-space:nowrap;font-size:18px}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
nav a.on,nav a:hover{color:var(--text);background:var(--card)}
.search{position:relative;margin-left:auto;min-width:220px;flex:0 1 340px}
.search input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2)}
.search input:focus{outline:2px solid var(--accent);border-color:transparent}
.results{position:absolute;top:calc(100% + 6px);right:0;width:max(100%,460px);max-width:94vw;background:var(--card);border:1px solid var(--line);
  border-radius:10px;max-height:60vh;overflow:auto;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.results.show{display:block}
.res{display:flex;gap:10px;align-items:center;padding:6px 10px;cursor:pointer}
.res:hover,.res.sel{background:var(--card2)}
.res img{width:44px;height:44px;object-fit:contain}
.res small{display:block;color:var(--muted);font-size:12px}
select.lang{padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg2)}

.layout{display:flex;min-height:calc(100vh - 57px)}
main{flex:1;min-width:0;padding:22px 24px 90px}
.panel{width:0;flex-shrink:0;overflow:hidden;border-left:1px solid var(--line);background:var(--bg2);transition:width .2s;
  position:sticky;top:57px;height:calc(100vh - 57px);display:flex;flex-direction:column}
.panel.open{width:min(46vw,760px)}
.ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .t{font-weight:700;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .sub{width:100%;color:var(--muted);font-size:12.5px}
.note{margin:10px 14px 0;padding:8px 10px;border-radius:8px;background:rgba(255,204,77,.1);color:var(--warn);font-size:13px;white-space:pre-line}
pre{margin:0;flex:1;overflow:auto;padding:14px;font:12.5px/1.5 var(--mono);color:#cfd6e6;white-space:pre}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a0d00}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}

h1{font-size:24px;margin:0 0 4px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:26px 0 12px}
.lead{color:var(--muted);margin:0 0 18px}
.crumb{color:var(--muted);font-size:14px;margin-bottom:14px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--text)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;cursor:pointer;
  transition:transform .12s,border-color .12s;position:relative}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile .ic{font-size:30px;margin-bottom:10px}
.tile b{display:block;font-size:17px}
.tile small{color:var(--muted)}
.tile .chk{position:absolute;top:10px;right:12px;color:var(--accent);font-weight:800;display:none}
.tile.on .chk{display:block}

.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px 22px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:#1a0d00}
.seg button small{display:block;font-weight:500;font-size:11.5px;opacity:.8}

.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.brand{height:86px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);
  border-radius:10px;cursor:pointer;padding:10px;position:relative;transition:border-color .12s,opacity .12s}
.brand{overflow:hidden}
.brand img{width:100%;height:100%;object-fit:contain;display:block}
.brand span{font-weight:700;text-align:center;font-size:13px}
.brand:hover{border-color:var(--accent)}
.brand.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.brand.off{opacity:.25;pointer-events:none}
.brand .cnt{position:absolute;right:6px;bottom:4px;font-size:11px;color:var(--muted)}
.brands.locked .brand{opacity:.35;pointer-events:none}

.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.car{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:center;position:relative}
.car:hover{border-color:var(--accent)}
.car.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.car img,.car .ph0{width:128px;height:128px;object-fit:contain;display:block;margin:0 auto}
.ph0{display:flex!important;align-items:center;justify-content:center;color:var(--muted);font-size:28px;font-weight:800;background:var(--bg2);border-radius:10px}
.car .nm{font-weight:650;font-size:13.5px;margin-top:6px;line-height:1.25}
.car .meta{display:flex;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.car .rq{font-size:12px;color:var(--accent2);margin-top:4px}
.car .tick{position:absolute;top:6px;right:8px;color:var(--accent);font-weight:900;display:none}
.car.on .tick{display:block}
.bd{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--bg2);color:var(--muted)}
.bd.gold{color:var(--gold)} .bd.purple{color:var(--purple)} .bd.legend{color:var(--legend)} .bd.tnr{color:var(--tnr)} .bd.shop{color:var(--shop)}

.hero{display:flex;gap:18px;align-items:center;margin-bottom:8px}
.hero img{width:128px;height:128px;object-fit:contain}
.hero .alt{color:var(--muted);font-size:13px}
.hero code{font-family:var(--mono);font-size:12.5px;color:var(--accent2)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.shot:hover{border-color:var(--accent)}
.shot.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.shot .img{aspect-ratio:16/9;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.shot .img img{width:100%;height:100%;object-fit:cover}
.shot .img img.v{width:auto;height:80%;object-fit:contain}
.shot .cap{padding:8px 10px;font-weight:650;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.shot .cap small{color:var(--muted);font-weight:500}
.shot.fus{cursor:zoom-in}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qty{display:flex;gap:8px;align-items:center}
.qty input,.row input[type=date],.row input[type=number]{width:150px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg2)}
.qty input:focus,.row input:focus{outline:2px solid var(--accent);border-color:transparent}
.hint{color:var(--muted);font-size:13px}
.sub-opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sub-opts label{display:flex;gap:6px;align-items:center;background:var(--bg2);border:1px solid var(--line);padding:4px 9px;border-radius:20px;font-size:13px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--accent)}

.bar{position:fixed;left:0;bottom:0;right:0;z-index:15;display:flex;gap:12px;align-items:center;padding:10px 24px;
  background:rgba(21,24,32,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.bar .sum{color:var(--muted);font-size:14px;flex:1}
.bar .sum b{color:var(--text)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ok);color:#04150d;font-weight:700;
  padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:94vw;max-height:92vh;border-radius:8px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.proto{font-size:11px;font-weight:700;color:#1a0d00;background:var(--warn);padding:2px 8px;border-radius:20px;margin-left:8px}

@media (max-width:900px){
  header{flex-wrap:wrap;padding:10px 16px;position:static}
  .search{order:5;flex:1 1 100%}
  main{padding:16px 16px 90px}
  .layout{flex-direction:column}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;height:70vh;width:100%!important;border-left:0;border-top:1px solid var(--line);
    transform:translateY(100%);transition:transform .2s;z-index:30}
  .panel.open{transform:none}
  .seg button{padding:9px 14px}
}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('#/')">CSR2 <span>DataBase</span><span class="proto">PROTOTYPE</span></div>
  <nav id="nav">
    <a href="#/cars" data-s="cars">Cars</a>
    <a href="#/fusions" data-s="fusions">Fusions</a>
    <a href="#/stage6" data-s="stage6">Stage 6</a>
    <a href="#/gifts" data-s="gifts">Support gift</a>
    <a href="#/discounts" data-s="discounts">Elite discount</a>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="Search a car (any name, any language, crdb)…" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <select class="lang" id="lang" title="Language of car names"></select>
</header>
<div class="layout">
  <main id="main"><div class="empty">Loading…</div></main>
  <aside class="panel" id="panel">
    <div class="ph">
      <div class="t" id="pt">—</div>
      <button class="btn sm" id="pcopy">Copy</button>
      <button class="btn sm" id="pdl">Download</button>
      <button class="btn sm" id="pclose" title="Close">✕</button>
      <div class="sub" id="psub"></div>
    </div>
    <div class="note" id="pnote" style="display:none"></div>
    <pre id="pre"></pre>
  </aside>
</div>
<div class="bar" id="bar" style="display:none"></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lb" onclick="this.classList.remove('show')"><img id="lbimg" alt=""></div>

<script>
window.SITE = 'x.Site/';   /* set by build_site.py: '' (preview) or 'x.Site/' (repository) */
/* ------------------------------------------------------------------ data loading */
const CSR = {data:{}, wait:{}, put(k,v){this.data[k]=v; (this.wait[k]||[]).forEach(f=>f(v)); delete this.wait[k];}};
const loaded = {};
function load(name){
  if (CSR.data[name]) return Promise.resolve(CSR.data[name]);
  return new Promise((res,rej)=>{
    (CSR.wait[name] = CSR.wait[name]||[]).push(res);
    if (loaded[name]) return;
    loaded[name] = true;
    const s = document.createElement('script'); s.src = window.SITE+'data/'+name+'.js';
    s.onerror = ()=>{ delete loaded[name]; rej(new Error('missing data/'+name+'.js')); };
    document.head.appendChild(s);
  });
}
const store = {
  get(k,d){ try{ const v=localStorage.getItem('csr2db.'+k); return v===null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('csr2db.'+k,v); }catch(e){} }
};
let IDX, CARS = {}, BRANDS = {}, LANG = store.get('lang','EN');
if (!['EN','FR','DE','ES','PT'].includes(LANG)) LANG = 'EN';

const LOCALE = {EN:'en-GB', FR:'fr-FR', DE:'de-DE', ES:'es-ES', PT:'pt-BR'};
function T(k, ...a){ const v = I18N[k]; let s = v ? (v[LANGS.indexOf(LANG)] ?? v[0]) : k; a.forEach((x,i)=>{ s = s.replace('{'+i+'}', x); }); return s; }
const num = n => Number(n).toLocaleString(LOCALE[LANG]||'en');
function applyStatic(){
  document.documentElement.lang = (LOCALE[LANG]||'en').slice(0,2);
  const n = {cars:'nav_cars', fusions:'nav_fus', stage6:'nav_s6', gifts:'nav_gift', discounts:'nav_disc'};
  document.querySelectorAll('#nav a').forEach(a=>a.textContent = T(n[a.dataset.s]));
  $('#q').placeholder = T('search_ph'); $('#lang').title = T('lang_title');

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const u = p => String(p||'').split('/').map(x=>x==='..'||x==='.'?x:encodeURIComponent(x)).join('/');
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function go(h){ if (location.hash===h) route(); else location.hash=h; }
function namesOf(c){
  const n = c.n||{};
  return (LANG==='PT' ? (n['PT-BR']||n.PT) : n[LANG]) || n.EN || {};
}
function nameOf(c, kind='M'){
  const v = namesOf(c)[kind] || ((c.n||{}).EN||{})[kind] || ((c.n||{}).EN||{}).M || c.fd || c.id;
  return String(v).trim();
}
const STAR = {gold:'Gold', purple:'Purple', legend:'Legends', tnr:'TNR', shop:'Shop', other:'Other'};
const MODE = {stock:'Stock', full:'Full', max:'Max'};
const MODE_SUB = {stock:'1.Stock', full:'2.Maxed', max:'3.Elite Max'};
function badges(c){
  let h = '';
  if (c.s) h += `<span class="bd ${c.s}">${STAR[c.s]||c.s}</span>`;
  if (c.t) h += `<span class="bd">${esc(c.t.replace('TIER_','T'))}</span>`;
  return h;
}
function thumb(c, cls=''){
  if (c && c.th) return `<img class="${cls}" src="${esc(u(window.SITE+c.th))}" alt="" loading="lazy">`;
  const b = c && BRANDS[c.b];
  return `<div class="ph0" title="${esc(T('no_vignette'))}">${b&&b.logo?`<img src="${esc(u(window.SITE+b.logo))}" alt="" style="width:70%;height:70%;object-fit:contain;opacity:.35">`:'?'}</div>`;
}
function brandTile(b, extra=''){
  const inner = b.logo ? `<img src="${esc(u(window.SITE+b.logo))}" alt="${esc(b.n)}" loading="lazy">` : `<span>${esc(b.n)}</span>`;
  return `<div class="brand ${extra}" data-b="${esc(b.k)}" title="${esc(b.n)}">${inner}</div>`;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }
function qtyValue(id){
  const v = $(id).value.trim();
  if (!/^\d+$/.test(v) || +v<1){ $(id).focus(); toast(T('t_qty')); return null; }
  return +v;
}
function sortCars(list){
  const o = {gold:0,purple:1,legend:2,tnr:3,shop:4,other:5};
  return list.sort((a,b)=>(o[a.s]??9)-(o[b.s]??9) || nameOf(a).localeCompare(nameOf(b)));
}

let PANEL = {text:'', file:'output.txt'};
function showPanel(title, text, file, sub='', note=''){
  PANEL = {text, file};
  $('#pt').textContent = title; $('#psub').textContent = sub || T('lines', num(text.split('\n').length), (text.length/1024).toFixed(1));
  $('#pre').textContent = text;

}

  toast(T('copied'));
};

};

let SEARCH = [];
function buildSearch(){
  SEARCH = IDX.cars.filter(c=>Object.keys(c.m||{}).length).map(c=>{
    const words = [c.id, c.fd];
    for (const l in (c.n||{})) for (const k in c.n[l]) words.push(c.n[l][k]);
    return {c, key: words.map(norm).join('|')};
  });
}
let selRes = -1;
$('#q').addEventListener('input', e=>{
  const words = e.target.value.split(/\s+/).map(norm).filter(Boolean); const box = $('#results'); selRes = -1;
  if (words.join('').length<2){ box.classList.remove('show'); return; }
  const hits = SEARCH.filter(s=>words.every(w=>s.key.includes(w))).slice(0,14).map(s=>s.c);
  box.innerHTML = hits.length ? hits.map((c,i)=>`<div class="res" data-i="${esc(c.id)}">${thumb(c)}<div><b>${esc(nameOf(c))}</b>
     <small>${esc((BRANDS[c.b]||{}).n||'')} · ${esc(c.id)}</small></div><div style="margin-left:auto">${badges(c)}</div></div>`).join('')
     : `<div class="res"><small>${esc(T('no_car_found'))}</small></div>`;
  box.classList.add('show');
});
$('#q').addEventListener('keydown', e=>{
  const items=[...document.querySelectorAll('#results .res[data-i]')]; if(!items.length) return;
  if(e.key==='ArrowDown'){selRes=Math.min(selRes+1,items.length-1);} else if(e.key==='ArrowUp'){selRes=Math.max(selRes-1,0);}
  else if(e.key==='Enter'){ (items[selRes]||items[0]).click(); return; } else return;
  e.preventDefault(); items.forEach((x,i)=>x.classList.toggle('sel',i===selRes));
});
$('#results').addEventListener('click', e=>{
  const r = e.target.closest('.res[data-i]'); if(!r) return;
  const c = CARS[r.dataset.i]; const cur = store.get('mode','stock');
  const mode = (c.m||{})[cur] ? cur : Object.keys(c.m)[0];
  $('#results').classList.remove('show'); $('#q').value='';
  go(`#/cars/${mode}/${c.b}/${c.id}`);
});

    } else {
      const parts = keys.map(k=>inner(F[k].t,'caup').replace(/"AMOUNT"/g, q));

    }
  };

  if ($('#fb')) $('#fb').onclick = e=>{ const t=e.target.closest('.brand'); if(!t) return; fusSel=t.dataset.b;

function inner(text, key){
  const a = text.indexOf('[', text.indexOf('"'+key+'"'))+1, b = text.lastIndexOf(']');
  return text.slice(a, b).replace(/^\s*\n/,'').replace(/\s+$/,'');
}

let s6Mode='one', s6Brand=null, s6Car=null;
async function pageStage6(){
  setNav('stage6'); bar(''); const S = await load('stage6');
  const fileFor = crdb => {
    if (S.files[crdb]) return {t:S.files[crdb], from:crdb};
    const g = S.groups[crdb]; if (!g) return null;
    const m = Object.keys(S.groups).find(x=>S.groups[x]===g && S.files[x]);
    return m ? {t:S.files[m], from:m} : null;
  };
  const withS6 = IDX.cars.filter(c=>fileFor(c.id) && (c.m && Object.keys(c.m).length));
  const brandKeys = [...new Set(withS6.map(c=>c.b))];
  const blist = IDX.brands.filter(b=>brandKeys.includes(b.k));
  // "all": one file per shared group
  const seen = new Set(); const allParts = []; let merged = 0;
  Object.keys(S.files).sort().forEach(k=>{ const key = S.groups[k] ? 'g'+S.groups[k] : k;
    if (seen.has(key)){ merged++; return; } seen.add(key); allParts.push(k); });
  $('#main').innerHTML = `<h1>Stage 6</h1><p class="lead">${T('s6_lead')}</p>
    <div class="seg" id="sm"><button data-m="one" class="${s6Mode==='one'?'on':''}">${T('by_car')}</button><button data-m="all" class="${s6Mode==='all'?'on':''}">${T('all_cars')}</button></div>
    <h2>${T('quantity')}</h2><div class="row qty"><input id="sq" type="number" min="1" placeholder="${T('eg',5)}" value="${esc(store.get('sq',''))}">
      <button class="btn pri" id="sg">${T('generate')}</button><span class="hint">${s6Mode==='one'?T('s6_hint_one'):T('s6_hint_all', allParts.length, merged)}</span></div>
    ${s6Mode==='one'?`<h2>${T('brand')}</h2><div class="brands" id="sb">${blist.map(b=>brandTile(b, b.k===s6Brand?'on':'')).join('')}</div>
      <div id="scars"></div>`:''}`;
  $('#sm').onclick = e=>{ const b=e.target.closest('button'); if(b){ s6Mode=b.dataset.m; pageStage6(); } };
  const renderCars = ()=>{
    if (!s6Brand){ $('#scars').innerHTML=''; return; }
    const list = sortCars(withS6.filter(c=>c.b===s6Brand));
    $('#scars').innerHTML = `<h2>${T('car')} · ${esc(BRANDS[s6Brand].n)}</h2><div class="cars" id="sc">${list.map(c=>`<div class="car ${c.id===s6Car?'on':''}" data-c="${esc(c.id)}">${thumb(c)}<div class="nm">${esc(nameOf(c))}</div><div class="meta">${badges(c)}</div></div>`).join('')}</div>`;
    $('#sc').onclick = e=>{ const c=e.target.closest('.car'); if(!c) return; s6Car=c.dataset.c;
      document.querySelectorAll('#sc .car').forEach(x=>x.classList.toggle('on',x===c));
      if (/^\d+$/.test($('#sq').value.trim())) gen(); };
  };
  const gen = ()=>{
    const q = qtyValue('#sq'); if(q===null) return; store.set('sq', q);
    if (s6Mode==='one'){
      if(!s6Car){ toast(T('t_car')); return; }
      const f = fileFor(s6Car); const g = S.groups[s6Car];
      const mates = g ? Object.keys(S.groups).filter(x=>S.groups[x]===g && x!==s6Car).map(x=>CARS[x]?`${nameOf(CARS[x])} (${STAR[CARS[x].s]||x})`:x) : [];
      showPanel(`Stage 6 · ${nameOf(CARS[s6Car])} · ×${q}`, f.t.replace(/"AMOUNT"/g,q), `${s6Car} stage6 x${q}.txt`, '',
        mates.length?T('s6_shared', g, mates.join(', ')):'');
    } else {
      const parts = allParts.map(k=>inner(S.files[k],'cues').replace(/"AMOUNT"/g,q));
      showPanel(`Stage 6 · ${T('all_cars')} · ×${q}`, '{\n  "cues": [\n'+parts.join(',\n')+'\n  ]\n}', `All stage6 x${q}.txt`, T('s6_hint_all', allParts.length, merged));
    }
  };
  $('#sg').onclick = gen;
  if ($('#sb')){ $('#sb').onclick = e=>{ const t=e.target.closest('.brand'); if(!t) return; s6Brand=t.dataset.b; s6Car=null;
    document.querySelectorAll('#sb .brand').forEach(x=>x.classList.toggle('on',x===t)); renderCars();
    $('#scars').scrollIntoView({behavior:'smooth', block:'start'}); }; renderCars(); }
}

/* ---- Support gifts */
let giftSel = new Set(), giftOpt = {}, restoView = false, restoSel = new Set();
async function pageGifts(){
  setNav('gifts'); bar(''); const G = (await load('gifts'));
  if (restoView) return pageResto(G);
  const icons = {cash:'💵',gold:'🪙',keys:'🔑',ect:'🎟️',fuel:'⛽',wildcard:'🃏',crewrp:'👥',collections:'📚'};
  $('#main').innerHTML = `<h1>${T('nav_gift')}</h1><p class="lead">${T('gift_lead')}</p>
    <div class="tiles" id="gt">${Object.entries(G.gifts).map(([k,g])=>`<div class="tile ${giftSel.has(k)?'on':''}" data-k="${k}"><span class="chk">✓</span>
      <div class="ic">${icons[k]||'🎁'}</div><b>${esc(I18N['g_'+k]?T('g_'+k):g.n)}</b><small>${g.opts.length>1?T('ntypes', g.opts.length):'&nbsp;'}</small>
      ${g.opts.length>1&&giftSel.has(k)?`<div class="sub-opts">${g.opts.map((o,i)=>`<label onclick="event.stopPropagation()"><input type="checkbox" data-k="${k}" data-i="${i}" ${(giftOpt[k]||[0]).includes(i)?'checked':''}>${esc(o.n)}</label>`).join('')}</div>`:''}
    </div>`).join('')}
      <div class="tile" id="rt"><div class="ic">🛠️</div><b>${T('resto')}</b><small>${T('resto_sub')}</small></div></div>
    <h2>${T('quantity')}</h2><div class="row qty"><input id="gq" type="number" min="1" placeholder="${T('eg',num(1000000))}" value="${esc(store.get('gq',''))}">
      <button class="btn pri" id="gg">${T('generate')}</button><span class="hint">${T('ngifts', giftSel.size)}</span></div>`;
  $('#gt').onclick = e=>{
    if (e.target.closest('#rt')){ restoView=true; pageGifts(); return; }
    const t=e.target.closest('.tile[data-k]'); if(!t) return; const k=t.dataset.k;
    giftSel.has(k)?giftSel.delete(k):giftSel.add(k); if(!giftOpt[k]) giftOpt[k]=[0]; pageGifts();
  };
  document.querySelectorAll('.sub-opts input').forEach(cb=>cb.onchange=()=>{
    const k=cb.dataset.k; giftOpt[k]=[...document.querySelectorAll(`.sub-opts input[data-k="${k}"]:checked`)].map(x=>+x.dataset.i);
  });
  $('#gg').onclick = ()=>{
    if(!giftSel.size){ toast(T('t_gift')); return; }
    const q = qtyValue('#gq'); if(q===null) return; store.set('gq', q);
    const items = []; const warns = []; const labels = [];
    for (const k of giftSel){ const g=G.gifts[k]; const idx = g.opts.length>1 ? (giftOpt[k]||[]) : [0];
      idx.forEach(i=>{ items.push(giftItem(g.opts[i].t).replace(/("amount":\s*)-?\d+/, '$1'+q)); labels.push(g.opts[i].n); });
      if (g.warn) warns.push(`${g.n}: ${g.warn.replace(/\s*\n\s*/g,' ')}`); }
    if(!items.length){ toast(T('t_type')); return; }
    showPanel(`${T('nav_gift')} · ×${q}`, giftBlock(items), `Support gift x${q}.txt`, labels.join(', '), warns.join('\n'));
  };
}
function giftItem(t){ return inner(t,'playinbitms'); }
function giftBlock(items){
  // one "eRewards" in "picl" for every dictionary in "playinbitms"
  const picl = items.map(()=>'    "eRewards"').join(',\n');
  return '"picl": [\n' + picl + '\n  ],\n  "playinbitms": [\n' + items.join(',\n') + '\n  ],';
}
function pageResto(G){
  const R = G.restoration; const list = R.cars.map(r=>({...(CARS[r.crdb]||{id:r.crdb}), q:r.q}));
  $('#main').innerHTML = `<div class="crumb"><a href="#/gifts" onclick="restoView=false">${T('nav_gift')}</a> › ${T('resto')}</div>
    <h1>${T('resto')}</h1><p class="lead">${T('resto_lead')}</p>
    <div class="row"><div class="seg" id="rm"><button data-m="one" class="${restoMode==='one'?'on':''}">${T('sel_cars')}</button><button data-m="all" class="${restoMode==='all'?'on':''}">${T('all_legends')}</button></div></div>
    <h2>${T('quantity')}</h2><div class="row qty"><input id="rq" type="number" min="1" placeholder="${T('rec_ph')}" value="">
      <button class="btn pri" id="rg">${T('generate')}</button><span class="hint" id="rh"></span></div>
    <h2>${T('cars')}</h2><div class="row" style="margin-bottom:10px"><button class="btn sm" id="rall">${T('select_all')}</button><button class="btn sm" id="rnone">${T('clear')}</button></div>
    <div class="cars" id="rc">${list.map(c=>`<div class="car ${restoSel.has(c.id)?'on':''}" data-c="${esc(c.id)}"><span class="tick">✓</span>${thumb(c)}<div class="nm">${esc(nameOf(c))}</div><div class="rq">${T('recommended', num(c.q))}</div></div>`).join('')}</div>`;
  const hint = ()=>{ $('#rh').textContent = restoMode==='all' ? T('all_n_legends', list.length) : T('nsel', restoSel.size); };
  hint();
  $('#rm').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; restoMode=b.dataset.m; document.querySelectorAll('#rm button').forEach(x=>x.classList.toggle('on',x===b)); hint(); };
  $('#rc').onclick = e=>{ const c=e.target.closest('.car'); if(!c) return; const id=c.dataset.c;
    restoSel.has(id)?restoSel.delete(id):restoSel.add(id); c.classList.toggle('on'); restoMode='one';
    document.querySelectorAll('#rm button').forEach(x=>x.classList.toggle('on',x.dataset.m==='one')); hint(); };
  $('#rall').onclick = ()=>{ list.forEach(c=>restoSel.add(c.id)); pageResto(G); };
  $('#rnone').onclick = ()=>{ restoSel.clear(); pageResto(G); };
  $('#rg').onclick = ()=>{
    const v=$('#rq').value.trim(); if (v && (!/^\d+$/.test(v)||+v<1)){ toast(T('t_invalid')); return; }
    const chosen = restoMode==='all' ? list : list.filter(c=>restoSel.has(c.id));
    if(!chosen.length){ toast(T('t_cars')); return; }
    const base = giftItem(R.t);
    const items = chosen.map(c=>base.replace(/("name":\s*)"[^"]*"/, `$1"${c.id}"`).replace(/("amount":\s*)-?\d+/, '$1'+(v?+v:c.q)));
    showPanel(`${T('resto')} · ${T('ncars', chosen.length)}`, giftBlock(items), `Restoration parts.txt`,
      v?T('qty_every', num(v)):T('qty_rec'));
  };
}
let restoMode='one';

/* ---- Elite discounts */
let discSel = new Set();
async function pageDiscounts(){
  setNav('discounts'); bar(''); const D = (await load('gifts')).discounts;
  const byCar = {}; D.groups.forEach(([g,c])=>{ (byCar[c]=byCar[c]||[]).push(g); });
  const list = sortCars(Object.keys(byCar).map(id=>CARS[id]||{id, fd:id}));
  const PCTS = [20,30,40,50,60]; let pct = +store.get('dpct','50'); if(!PCTS.includes(pct)) pct = 50;
  $('#main').innerHTML = `<h1>${T('nav_disc')}</h1><p class="lead">${T('disc_lead')}</p>
    <div class="note" style="margin:0 0 16px">${T('disc_warn')}</div>
    <div class="row"><span class="hint">${T('discount')}</span><div class="seg" id="dpct">${PCTS.map(v=>`<button data-v="${v}" class="${v===pct?'on':''}">${v}%</button>`).join('')}</div>
      <button class="btn pri" id="dg">${T('generate')}</button><span class="hint" id="dh"></span></div>
    <h2>${T('elite_cars')} · ${list.length}</h2><div class="row" style="margin-bottom:10px"><button class="btn sm" id="dall">${T('select_all')}</button><button class="btn sm" id="dnone">${T('clear')}</button></div>
    <div class="cars" id="dc">${list.map(c=>`<div class="car ${discSel.has(c.id)?'on':''}" data-c="${esc(c.id)}"><span class="tick">✓</span>${thumb(c)}<div class="nm">${esc(nameOf(c))}</div><div class="meta">${badges(c)}</div></div>`).join('')}</div>`;
  const hint=()=>{ $('#dh').textContent = T('nsel', discSel.size); }; hint();
  $('#dpct').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; pct=+b.dataset.v; store.set('dpct',pct);
    document.querySelectorAll('#dpct button').forEach(x=>x.classList.toggle('on',x===b)); };
  $('#dc').onclick = e=>{ const c=e.target.closest('.car'); if(!c) return; const id=c.dataset.c; discSel.has(id)?discSel.delete(id):discSel.add(id); c.classList.toggle('on'); hint(); };
  $('#dall').onclick = ()=>{ list.forEach(c=>discSel.add(c.id)); pageDiscounts(); };
  $('#dnone').onclick = ()=>{ discSel.clear(); pageDiscounts(); };
  $('#dg').onclick = ()=>{
    if(!discSel.size){ toast(T('t_cars')); return; }
    const exp = new Date(Date.now() + 29*3600*1000); const ts = Math.floor(exp.getTime()/1000);
    const groups = [...new Set([...discSel].flatMap(id=>byCar[id]))].sort();
    const body = groups.map(g=>`    "${g}": [\n      ${pct},\n      ${ts}\n    ]`).join(',\n');
    showPanel(`${T('nav_disc')} · ${pct}% · ${T('ngroups', groups.length)}`, `  "ecdm": {\n${body}\n  }`, `Elite discount ${pct}.txt`,
      `${T('ncars', discSel.size)} · ${T('groups')}: ${groups.join(', ')}`,
      T('disc_note', exp.toLocaleString(LOCALE[LANG]), ts));
  };
}

/* ------------------------------------------------------------------ router */
function route(){
  const p = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
  window.scrollTo(0,0); $('#results').classList.remove('show');
  if (p[0]!=='cars') closePanel();
  if (!p.length) return pageHome();
  if (p[0]==='cars'){
    if (p.length===1) { closePanel(); return pageCarsHome(); }
    if (p.length===3 && BRANDS[p[2]]) { closePanel(); return pageCarsBrand(p[1], p[2]); }
    if (p.length===4 && CARS[p[3]]) return pageCar(p[1], p[2], p[3]);
    return pageCarsHome();
  }
  if (p[0]==='fusions') return pageFusions();
  if (p[0]==='stage6') return pageStage6();
  if (p[0]==='gifts'){ if(p.length===1) restoView=false; return pageGifts(); }
  if (p[0]==='discounts') return pageDiscounts();
  pageHome();
}
window.addEventListener('hashchange', route);

load('index').then(d=>{
  IDX = d; IDX.cars.forEach(c=>CARS[c.id]=c); IDX.brands.forEach(b=>BRANDS[b.k]=b);
  const sel = $('#lang'); sel.innerHTML = LANGS.map(l=>`<option ${l===LANG?'selected':''}>${l}</option>`).join('');
  sel.value = LANG; sel.onchange = ()=>{ LANG=sel.value; store.set('lang',LANG); applyStatic(); buildSearch(); route(); };
  applyStatic(); buildSearch(); route();
}).catch(e=>{ $('#main').innerHTML = `<div class="empty">Data not found (${esc(e.message)}). Run build_site.py first.</div>`; });
</script>
